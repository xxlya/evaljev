[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaljev"
version = "0.1.0"
description = "Runtime assurance, replay, and auto-diagnostics for Jev/System-One decision workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EvalJev contributors"}]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16.8,<0.17"]
llm = ["anthropic>=0.40", "google-genai>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
